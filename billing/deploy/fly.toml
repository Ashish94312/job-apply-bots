# Fly.io settings for the billing service. Set `app` to the name you created with `fly apps create`.
app = "sendoff-billing"
primary_region = "sin" # Singapore, the closest region to India (Fly closed Mumbai)

[build]
  dockerfile = "Dockerfile"

[env]
  BILLING_MODE = "sandbox"
  BILLING_ORIGIN = "https://sendoff-billing.fly.dev" # your app's address; later your own domain
  BILLING_OFFERS = '{"sendoff":"v2"}' # v2: ₹251 for 30 days
  BILLING_TRIALS = '{}' # no free trial
  # BILLING_EXTENSION_ID is set with `fly secrets set` (it changes per install), like the keys.

[mounts]
  source = "billing_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off" # always on: Cashfree's payment notifications and the recovery sweep need it
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
