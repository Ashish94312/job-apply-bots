# Browser to drive. "chrome" = your installed Google Chrome (gets past Cloudflare checks more often).
browser_channel: chrome

# Login: INSTAHYRE_EMAIL / INSTAHYRE_PASSWORD from the .env file in the repo root (see .env.example).

# What to search for. The bot builds the search pages itself from these.
# Each keyword is searched for every experience year in the range (Instahyre's years=N means "minimum N years").
search:
  keywords:
    - generative ai
    - agentic ai
    - llm
    - ai engineer
    - machine learning
    - artificial intelligence
    - nlp
    - deep learning
    - computer vision
    - mlops
    - rag
    - langchain
    - data science
    - python developer
    - backend engineer
    - backend developer
    - software engineer
    - software developer
    - sde
    - full stack developer
    - python
  min_experience: 1
  max_experience: 2

# Optional: any extra search page to go through as-is.
search_urls: []

filters:
  # Apply only if the title has at least one of these (whole word, any case). Empty list = any title.
  include_title:
    - machine learning
    - ml
    - ai
    - artificial intelligence
    - deep learning
    - data scientist
    - data science
    - nlp
    - computer vision
    - llm
    - genai
    - gen ai
    - generative ai
    - agentic
    - mlops
    - rag
    - langchain
    - python
    - django
    - fastapi
    - backend
    - back end
    - software engineer
    - software developer
    - software development engineer
    - sde
    - full stack
    - fullstack
    - full-stack
  # Junior profile: skip senior titles, internships, testing/support and non-engineering roles.
  exclude_title:
    - senior
    - sr
    - lead
    - staff
    - principal
    - manager
    - director
    - head
    - architect
    - vp
    - chief
    - intern
    - internship
    - sales
    - marketing
    - recruiter
    - business development
    - trainer
    - tutor
    - teacher
    - faculty
    - qa
    - sdet
    - tester
    - support
    - hr
    - content
    - writer
  exclude_companies: []
  # Skip if the job description mentions any of these.
  exclude_text: []
  # Skip jobs whose minimum required experience (e.g. "3 - 6 years" -> 3) is above this.
  max_experience_required: 2

limits:
  max_per_run: 10
  max_per_day: 30
  delay_seconds: [20, 45]  # random pause after each application
  max_scrolls: 5           # how far to scroll each search page for more results

# Message for "note to recruiter" / "type your message" boxes; {title} and {company} are filled in.
# Leave empty to apply without a message.
cover_note: ""

# Answers to screening questions. Key = regex matched against the question text (any case).
# A question with no matching answer marks the job needs_manual; the bot never guesses.
answers:
  "notice period": "30 days"
  "current.*(ctc|salary|compensation)|(ctc|salary|compensation).*current": "8 LPA"
  "expect.*(ctc|salary|compensation)|(ctc|salary|compensation).*expect": "12 LPA"
  "years? of experi?e?nce|total experi?e?nce|how much experi?e?nce": "2"
  "current (city|location)": "Bengaluru"
  # Yes/No questions: the answer must match an option's text. First matching pattern wins.
  "currently (living|located|residing|based) in (bengaluru|bangalore)": "Yes"
  "currently (living|located|residing|based) in": "No"
  "relocat": "Yes"
  "immediate(ly)? join|join immediately": "Yes"
